<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Voice — распознавание и запись</title>

    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel для JSX в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* ============================================================
           Дизайн-токены (те же, что были в MAX UI)
           ============================================================ */
        :root {
            --max-bg: #f5f5f7;
            --max-surface: #ffffff;
            --max-surface-secondary: #f0f0f3;
            --max-surface-tertiary: #e8e8ec;
            --max-text: #000000;
            --max-text-secondary: #6b6b70;
            --max-text-tertiary: #9a9aa0;
            --max-border: rgba(0, 0, 0, 0.08);
            --max-primary: #007aff;
            --max-primary-hover: #0066d6;
            --max-destructive: #ff3b30;
            --max-radius-sm: 8px;
            --max-radius-md: 12px;
            --max-radius-lg: 16px;
            --max-radius-xl: 20px;
            --max-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            --top-bar-h: 56px;
            --bottom-bar-h: 64px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--max-bg);
            font-family: var(--max-font);
            color: var(--max-text);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--top-bar-h) + 20px) 16px calc(var(--bottom-bar-h) + 40px);
        }

        /* ============================================================
           Верхняя панель
           ============================================================ */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--top-bar-h);
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--max-border);
            z-index: 100;
        }
        .top-bar__inner {
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar__brand {
            font-size: 17px;
            font-weight: 700;
        }

        /* ============================================================
           Нижняя панель
           ============================================================ */
        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px;
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-top: 1px solid var(--max-border);
            z-index: 100;
        }
        .bottom-bar__inner {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .bottom-bar .btn { flex: 1; }

        /* ============================================================
           Типографика
           ============================================================ */
        .t-title-1 { font-size: 22px; font-weight: 700; line-height: 1.25; margin: 0; }
        .t-title-3 { font-size: 16px; font-weight: 600; line-height: 1.35; margin: 0; }
        .t-body    { font-size: 15px; font-weight: 400; line-height: 1.4; margin: 0; }
        .t-caption { font-size: 13px; font-weight: 400; line-height: 1.3; color: var(--max-text-secondary); margin: 0; }

        /* ============================================================
           Панель
           ============================================================ */
        .panel {
            background: var(--max-surface);
            border-radius: var(--max-radius-lg);
            padding: 16px;
        }
        .panel--secondary { background: var(--max-surface-secondary); }

        .panel__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }
        .panel__title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        /* ============================================================
           Button
           ============================================================ */
        .btn {
            appearance: none;
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            line-height: 1;
            padding: 12px 18px;
            border-radius: var(--max-radius-md);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, opacity 0.15s, transform 0.05s;
            user-select: none;
            text-decoration: none;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn--primary   { background: var(--max-primary); color: #fff; }
        .btn--primary:hover:not(:disabled) { background: var(--max-primary-hover); }

        .btn--secondary { background: var(--max-surface-secondary); color: var(--max-text); }
        .btn--secondary:hover:not(:disabled) { background: var(--max-surface-tertiary); }

        .btn--ghost     { background: transparent; color: var(--max-primary); }
        .btn--ghost:hover:not(:disabled) { background: rgba(0, 122, 255, 0.08); }

        .btn--destructive { background: var(--max-destructive); color: #fff; }
        .btn--destructive:hover:not(:disabled) { background: #e02e24; }

        .btn--sm { padding: 9px 14px; font-size: 14px; }

        /* ============================================================
           IconButton
           ============================================================ */
        .icon-btn {
            appearance: none;
            border: none;
            background: var(--max-surface-secondary);
            color: var(--max-text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s, transform 0.05s, color 0.15s;
            flex-shrink: 0;
        }
        .icon-btn:active:not(:disabled) { transform: scale(0.94); }
        .icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .icon-btn:hover:not(:disabled) { background: var(--max-surface-tertiary); }

        .icon-btn--recording {
            background: var(--max-destructive);
            color: #fff;
        }
        .icon-btn--recording:hover:not(:disabled) {
            background: #e02e24;
        }

        /* ============================================================
           Textarea
           ============================================================ */
        .textarea {
            font-family: inherit;
            font-size: 15px;
            color: var(--max-text);
            background: var(--max-surface-secondary);
            border: 1px solid transparent;
            border-radius: var(--max-radius-md);
            padding: 12px 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.15s, background 0.15s;
            resize: vertical;
            min-height: 140px;
            line-height: 1.45;
        }
        .textarea::placeholder { color: var(--max-text-tertiary); }
        .textarea:focus {
            background: var(--max-surface);
            border-color: var(--max-primary);
        }

        /* ============================================================
           Индикатор записи
           ============================================================ */
        .rec-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--max-destructive);
            flex-shrink: 0;
            animation: rec-pulse 1s ease-in-out infinite;
        }
        @keyframes rec-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(0.75); }
        }
        .rec-time {
            font-variant-numeric: tabular-nums;
            font-size: 14px;
            font-weight: 600;
            color: var(--max-destructive);
            min-width: 48px;
        }

        /* ============================================================
           Сетка / Flex
           ============================================================ */
        .col { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .demo-section { margin-bottom: 24px; }

        /* ============================================================
           Audio player
           ============================================================ */
        .audio-player {
            width: 100%;
            border-radius: var(--max-radius-md);
            background: var(--max-surface-secondary);
        }

        /* ============================================================
           Предупреждение
           ============================================================ */
        .warn {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: rgba(255, 149, 0, 0.12);
            color: #8a5a00;
            border: 1px solid rgba(255, 149, 0, 0.3);
            border-radius: var(--max-radius-md);
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.4;
        }
        .warn--error {
            background: rgba(255, 59, 48, 0.1);
            color: #a3231b;
            border-color: rgba(255, 59, 48, 0.3);
        }
        .warn__icon { flex-shrink: 0; margin-top: 1px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // ============================================================
        // SVG-иконки
        // ============================================================
        const MicIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3" />
                <path d="M5 10v1a7 7 0 0 0 14 0v-1" />
                <line x1="12" y1="19" x2="12" y2="22" />
                <line x1="8" y1="22" x2="16" y2="22" />
            </svg>
        );

        const StopIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
        );

        const DownloadIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
        );

        const TrashIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M10 11v6M14 11v6" />
                <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
            </svg>
        );

        const CloseIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        );

        const AlertIcon = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
        );

        // ============================================================
        // Утилиты
        // ============================================================
        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        const downloadBlob = (blob, filename) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        const REC_LIMIT_SEC = 10;

        const checkEnvironment = () => {
            const isSecure = window.isSecureContext;
            const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
            const hasMediaRecorder = typeof window.MediaRecorder !== 'undefined';
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const hasSpeechRecognition = !!SR;
            return { isSecure, hasMediaDevices, hasMediaRecorder, hasSpeechRecognition };
        };

        // ============================================================
        // Секция 1: Распознавание речи (STT)
        // Состояние текста поднято в App (sttText / setSttText)
        // ============================================================
        const SpeechRecognitionSection = ({
            disabledByOther,
            onStateChange,
            text,
            setText,
        }) => {
            const [listening, setListening] = useState(false);
            const [interim, setInterim] = useState('');
            const [seconds, setSeconds] = useState(0);

            const recRef = useRef(null);
            const timerRef = useRef(null);
            const autoStopRef = useRef(null);
            const textRef = useRef(text);

            // Синхронизируем ref с внешним значением
            useEffect(() => {
                textRef.current = text;
            }, [text]);

            const stopAll = useCallback(() => {
                if (recRef.current) {
                    try { recRef.current.stop(); } catch (e) {}
                    recRef.current = null;
                }
                if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
                if (autoStopRef.current) { clearTimeout(autoStopRef.current); autoStopRef.current = null; }
                setListening(false);
                setInterim('');
            }, []);

            const start = useCallback(() => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    alert('SpeechRecognition не поддерживается в этом браузере.');
                    return;
                }
                const rec = new SR();
                rec.lang = 'ru-RU';
                rec.continuous = true;
                rec.interimResults = true;

                rec.onresult = (event) => {
                    let finalPart = '';
                    let interimPart = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const res = event.results[i];
                        if (res.isFinal) {
                            finalPart += res[0].transcript;
                        } else {
                            interimPart += res[0].transcript;
                        }
                    }
                    if (finalPart) {
                        const newText = textRef.current + finalPart;
                        textRef.current = newText;
                        setText(newText);
                    }
                    setInterim(interimPart);
                };

                rec.onerror = (e) => {
                    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                        alert('Доступ к микрофону запрещён.');
                    }
                    stopAll();
                };

                rec.onend = () => {
                    setListening(false);
                    setInterim('');
                    if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
                    if (autoStopRef.current) { clearTimeout(autoStopRef.current); autoStopRef.current = null; }
                };

                try {
                    rec.start();
                } catch (e) {
                    alert('Не удалось запустить распознавание: ' + e.message);
                    return;
                }

                recRef.current = rec;
                setListening(true);
                setSeconds(0);

                timerRef.current = setInterval(() => {
                    setSeconds((s) => s + 1);
                }, 1000);

                autoStopRef.current = setTimeout(() => {
                    stopAll();
                }, REC_LIMIT_SEC * 1000);
            }, [stopAll, setText]);

            useEffect(() => {
                return () => stopAll();
            }, [stopAll]);

            // Сообщаем наверх о состоянии активности
            useEffect(() => {
                onStateChange && onStateChange(listening);
            }, [listening, onStateChange]);

            const toggle = () => {
                if (listening) stopAll();
                else start();
            };

            const clearText = () => {
                textRef.current = '';
                setText('');
                setInterim('');
            };

            const downloadText = () => {
                const all = (text + (interim ? ' ' + interim : '')).trim();
                if (!all) return;
                const blob = new Blob([all], { type: 'text/plain;charset=utf-8' });
                downloadBlob(blob, `speech-${Date.now()}.txt`);
            };

            const displayValue = text + (interim ? (text ? ' ' : '') + interim : '');

            return (
                <div className="panel demo-section">
                    <div className="panel__header">
                        <h2 className="panel__title">Распознавание речи</h2>
                        {listening ? (
                            <div className="rec-row">
                                <span className="rec-dot" />
                                <span className="rec-time">{formatTime(seconds)}</span>
                            </div>
                        ) : (
                            <span className="t-caption">Автостоп: {REC_LIMIT_SEC} сек</span>
                        )}
                    </div>

                    <div className="col">
                        <div className="row">
                            <button
                                className={`icon-btn ${listening ? 'icon-btn--recording' : ''}`}
                                onClick={toggle}
                                title={listening ? 'Остановить' : 'Начать распознавание'}
                            >
                                {listening ? <StopIcon /> : <MicIcon />}
                            </button>
                            <span className="t-body">
                                {listening ? 'Слушаю...' : 'Нажмите микрофон'}
                            </span>
                        </div>

                        <textarea
                            className="textarea"
                            placeholder="Здесь появится распознанный текст..."
                            value={displayValue}
                            onChange={(e) => {
                                textRef.current = e.target.value;
                                setText(e.target.value);
                                setInterim('');
                            }}
                        />

                        <div className="row">
                            <button
                                className="btn btn--secondary btn--sm"
                                onClick={clearText}
                                disabled={!displayValue}
                            >
                                <TrashIcon size={16} />
                                Очистить текст
                            </button>
                            <button
                                className="btn btn--secondary btn--sm"
                                onClick={downloadText}
                                disabled={!displayValue}
                            >
                                <DownloadIcon size={16} />
                                Скачать текст
                            </button>
                        </div>

                        {disabledByOther && (
                            <p className="t-caption" style={{ color: 'var(--max-destructive)' }}>
                                Идёт запись аудио — одновременное использование не рекомендуется.
                            </p>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================================
        // Секция 2: Голосовое сообщение (аудиозапись)
        // audioUrl / audioBlob живут в App
        // ============================================================
        const AudioRecordingSection = ({
            disabledByOther,
            onStateChange,
            audioUrl,
            setAudioUrl,
            audioBlob,
            setAudioBlob,
        }) => {
            const [recording, setRecording] = useState(false);
            const [seconds, setSeconds] = useState(0);
            const [error, setError] = useState('');

            const mediaRecorderRef = useRef(null);
            const streamRef = useRef(null);
            const chunksRef = useRef([]);
            const timerRef = useRef(null);
            const autoStopRef = useRef(null);

            const cleanupStream = useCallback(() => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach((t) => t.stop());
                    streamRef.current = null;
                }
            }, []);

            const stopAll = useCallback(() => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    try { mediaRecorderRef.current.stop(); } catch (e) {}
                }
                if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
                if (autoStopRef.current) { clearTimeout(autoStopRef.current); autoStopRef.current = null; }
                setRecording(false);
            }, []);

            const start = useCallback(async () => {
                setError('');
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    setError('getUserMedia не поддерживается.');
                    return;
                }
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {
                    setError('Не удалось получить доступ к микрофону: ' + e.message);
                    return;
                }
                streamRef.current = stream;

                let mimeType = 'audio/webm;codecs=opus';
                if (!window.MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/webm';
                    if (!window.MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = '';
                    }
                }

                let mr;
                try {
                    mr = mimeType
                        ? new MediaRecorder(stream, { mimeType })
                        : new MediaRecorder(stream);
                } catch (e) {
                    setError('Не удалось создать MediaRecorder: ' + e.message);
                    cleanupStream();
                    return;
                }

                chunksRef.current = [];

                mr.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunksRef.current.push(e.data);
                };

                mr.onstop = () => {
                    const blob = new Blob(chunksRef.current, { type: mr.mimeType || 'audio/webm' });
                    chunksRef.current = [];
                    cleanupStream();
                    if (blob.size > 0) {
                        // Освобождаем старый URL, если был
                        if (audioUrl) URL.revokeObjectURL(audioUrl);
                        setAudioBlob(blob);
                        setAudioUrl(URL.createObjectURL(blob));
                    }
                };

                try {
                    mr.start();
                } catch (e) {
                    setError('Не удалось запустить запись: ' + e.message);
                    cleanupStream();
                    return;
                }

                mediaRecorderRef.current = mr;
                setRecording(true);
                setSeconds(0);

                timerRef.current = setInterval(() => {
                    setSeconds((s) => s + 1);
                }, 1000);

                autoStopRef.current = setTimeout(() => {
                    stopAll();
                }, REC_LIMIT_SEC * 1000);
            }, [cleanupStream, stopAll, audioUrl, setAudioBlob, setAudioUrl]);

            useEffect(() => {
                return () => {
                    stopAll();
                    cleanupStream();
                };
            }, [stopAll, cleanupStream]);

            // Сообщаем наверх о состоянии активности
            useEffect(() => {
                onStateChange && onStateChange(recording);
            }, [recording, onStateChange]);

            const toggle = () => {
                if (recording) stopAll();
                else start();
            };

            const cancelAudio = () => {
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                setAudioUrl('');
                setAudioBlob(null);
                setSeconds(0);
            };

            const downloadAudio = () => {
                if (!audioBlob) return;
                downloadBlob(audioBlob, `voice-${Date.now()}.webm`);
            };

            return (
                <div className="panel demo-section">
                    <div className="panel__header">
                        <h2 className="panel__title">Голосовое сообщение</h2>
                        {recording ? (
                            <div className="rec-row">
                                <span className="rec-dot" />
                                <span className="rec-time">{formatTime(seconds)}</span>
                            </div>
                        ) : (
                            <span className="t-caption">Автостоп: {REC_LIMIT_SEC} сек</span>
                        )}
                    </div>

                    <div className="col">
                        <div className="row">
                            <button
                                className={`btn ${recording ? 'btn--destructive' : 'btn--primary'}`}
                                onClick={toggle}
                            >
                                {recording ? <StopIcon size={18} /> : <MicIcon size={18} />}
                                {recording ? 'Стоп' : 'Записать'}
                            </button>
                            {audioUrl && !recording && (
                                <>
                                    <button
                                        className="btn btn--secondary btn--sm"
                                        onClick={cancelAudio}
                                    >
                                        <CloseIcon size={16} />
                                        Отмена
                                    </button>
                                    <button
                                        className="btn btn--secondary btn--sm"
                                        onClick={downloadAudio}
                                    >
                                        <DownloadIcon size={16} />
                                        Скачать
                                    </button>
                                </>
                            )}
                        </div>

                        {audioUrl && (
                            <audio
                                className="audio-player"
                                src={audioUrl}
                                controls
                            />
                        )}

                        {!audioUrl && !recording && (
                            <p className="t-caption">Записи пока нет.</p>
                        )}

                        {error && (
                            <div className="warn warn--error">
                                <span className="warn__icon"><AlertIcon /></span>
                                <span>{error}</span>
                            </div>
                        )}

                        {disabledByOther && (
                            <p className="t-caption" style={{ color: 'var(--max-destructive)' }}>
                                Идёт распознавание речи — одновременное использование не рекомендуется.
                            </p>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================================
        // Нижняя панель
        // ============================================================
        const BottomBar = ({ onCancel, onDownload, downloadDisabled }) => (
            <div className="bottom-bar">
                <div className="bottom-bar__inner">
                    <button
                        className="btn btn--secondary"
                        onClick={onCancel}
                    >
                        <CloseIcon size={18} />
                        Отмена
                    </button>
                    <button
                        className="btn btn--primary"
                        onClick={onDownload}
                        disabled={downloadDisabled}
                    >
                        <DownloadIcon size={18} />
                        Скачать
                    </button>
                </div>
            </div>
        );

        // ============================================================
        // Приложение
        // ============================================================
        const App = () => {
            const [env, setEnv] = useState(null);

            // Общее состояние, поднятое наверх
            const [sttActive, setSttActive] = useState(false);
            const [recActive, setRecActive] = useState(false);

            const [sttText, setSttText] = useState('');
            const [audioUrl, setAudioUrl] = useState('');
            const [audioBlob, setAudioBlob] = useState(null);

            useEffect(() => {
                setEnv(checkEnvironment());
            }, []);

            const handleCancelAll = () => {
                const hasAnything = sttText.trim() || audioBlob;
                if (!hasAnything) return;
                if (!window.confirm('Сбросить распознанный текст и запись?')) return;

                // Сбрасываем текст (дочерняя секция синхронизируется через props)
                setSttText('');

                // Сбрасываем аудио
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                setAudioUrl('');
                setAudioBlob(null);
            };

            const handleDownloadMain = () => {
                if (!audioBlob) return;
                downloadBlob(audioBlob, `voice-${Date.now()}.webm`);
            };

            if (!env) return null;

            return (
                <React.Fragment>
                    <div className="top-bar">
                        <div className="top-bar__inner">
                            <span className="top-bar__brand">Voice</span>
                        </div>
                    </div>

                    <div className="app">
                        {!env.isSecure && (
                            <div className="warn warn--error demo-section">
                                <span className="warn__icon"><AlertIcon /></span>
                                <span>
                                    Страница открыта в небезопасном контексте.
                                    Микрофон недоступен — используйте HTTPS или <code>localhost</code>.
                                </span>
                            </div>
                        )}

                        {env.isSecure && !env.hasSpeechRecognition && (
                            <div className="warn demo-section">
                                <span className="warn__icon"><AlertIcon /></span>
                                <span>
                                    SpeechRecognition не поддерживается. Откройте в Chrome.
                                </span>
                            </div>
                        )}

                        <SpeechRecognitionSection
                            disabledByOther={recActive}
                            onStateChange={setSttActive}
                            text={sttText}
                            setText={setSttText}
                        />

                        <AudioRecordingSection
                            disabledByOther={sttActive}
                            onStateChange={setRecActive}
                            audioUrl={audioUrl}
                            setAudioUrl={setAudioUrl}
                            audioBlob={audioBlob}
                            setAudioBlob={setAudioBlob}
                        />
                    </div>

                    <BottomBar
                        onCancel={handleCancelAll}
                        onDownload={handleDownloadMain}
                        downloadDisabled={!audioBlob}
                    />
                </React.Fragment>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
